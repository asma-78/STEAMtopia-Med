<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="home.css">
  <style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

/* TOP BAR */
   .topbar {
    height: 60px;
    background: #1e1e2f;
    color: white;
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 0 20px;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
}

.menu-toggle {
    display: none;
    background: none;
    border: none;
    font-size: 26px;
    color: white;
    cursor: pointer;
}

/* SIDEBAR */
.sidebar {
    position: fixed;
    top: 60px;
    left: 0;
    width: 220px;
    height: calc(100vh - 60px);
    background: #2a2a40;
    padding: 20px;
}

.sidebar a {
    display: block;
    color: white;
    text-decoration: none;
    margin-bottom: 15px;
}

/* MAIN CONTENT */
.main-content {
    margin-top: 60px;
    margin-left: 220px;
    padding: 25px;
}

/* OVERLAY */
.overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 900;
}

/* MOBILE */
@media (max-width: 768px) {
    .menu-toggle {
        display: block;
    }

    .sidebar {
        transform: translateX(-100%);
        transition: 0.3s;
        width: 80%;
        max-width: 280px;
        z-index: 1001;
    }

    .sidebar.active {
        transform: translateX(0);
    }

    .main-content {
        margin-left: 0;
    }

    .overlay.active {
        display: block;
    }
}
</style>
</head>
<body>

    <!-- TOP BAR -->
    <header class="topbar">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <h1>STEAMpark</h1>
    </header>

    <!-- SIDEBAR -->
    <nav class="sidebar" id="sidebar">
        <a href="#">Home</a>
        <a href="#">Groups</a>
        <a href="#">Live Sessions</a>
        <a href="#">STEAM Subjects</a>
        <a href="#">Teachers</a>
        <a href="#">Support</a>
    </nav>

    <!-- OVERLAY (mobile) -->
    <div class="overlay" id="overlay"></div>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <h2>Welcome to STEAMpark 👋</h2>
        <p>
            Learning science, technology, engineering, arts, and math —
            in a fun, interactive, and inclusive way.
        </p>
    </main>

    <script src="home.js">const menuToggle = document.getElementById("menuToggle");
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");

menuToggle.addEventListener("click", () => {
    sidebar.classList.toggle("active");
    overlay.classList.toggle("active");
});

overlay.addEventListener("click", () => {
    sidebar.classList.remove("active");
    overlay.classList.remove("active");
});
</script>
</body>
</html>
